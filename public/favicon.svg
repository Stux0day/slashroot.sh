<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Invite de terminal « >_ » : chevron rouge (signal du thème rouge),
	     curseur clair (text), sur le fond sombre du site (void). Couleurs
	     fixes : un favicon ne lit pas les jetons CSS. Les versions PNG et ICO
	     sont générées à partir de ce dessin (voir README, section Favicon).
